[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lia-experiment-pipeline"
version = "0.1.0"
description = "Reproducible experiment pipeline for Lorentz-Invariant Auctions (LiA)"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
